name: 📉 資料錯誤（股價 / 市值 / 財務資料）
description: 報告中的股價、市值、估值或財務資料有誤
title: "[Data] "
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        感謝反饋 🙏 資料類問題**必須給出可核實的證據**：具體標的 + 錯誤數值 + 你認為的正確值 + **來源連結**。
        只說"資料經常錯"而不給具體例子，無法核實，會被要求補充。
  - type: input
    id: ticker
    attributes:
      label: 涉及的標的 / 股票程式碼
      placeholder: "英偉達 NVDA / 騰訊 0700.HK / 三七互娛 002555"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 出現問題的 Skill 或報告
      description: 哪個 skill 生成的、或 reports/ 下哪份報告（貼路徑或連結）。
      placeholder: "reports/台積電/深度分析/台積電-research-20260408.md，或 /investment-research"
    validations:
      required: true
  - type: textarea
    id: wrong-value
    attributes:
      label: 錯誤的資料是什麼
      description: 哪個欄位（股價/市值/PE/收入……）、報告裡顯示的值是多少。
      placeholder: "報告寫『市值 4.33 萬億港元』"
    validations:
      required: true
  - type: textarea
    id: correct-value
    attributes:
      label: 你認為的正確值 + 來源（必填）
      description: 正確值應該是多少？**必須附來源連結**（富途/東財/官方財報等），並說明是否涉及復權、送轉、增發、匯率等口徑問題。
      placeholder: |
        正確應為 ~4.65 萬億港元。
        來源：https://www.futunn.com/stock/00700-HK
        原因：報告用的總股本是增發前的舊值 / 歷史價未做前復權
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 復現命令 / 步驟
      placeholder: "/investment-research 騰訊"
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 確認
      options:
        - label: 我已搜尋過現有 issue，確認沒有重複
          required: true
        - label: 我已提供正確值及可核實的來源連結
          required: true
