name: 💬 討論 / 新 Skill 提議 / 其他
description: 新 skill 提議、用法討論、致謝或一般反饋（非報錯/資料/建議類）
title: "[討論] "
labels: ["discussion"]
body:
  - type: markdown
    attributes:
      value: |
        這裡用於**非問題類**的交流：新 skill 提議、用法討論、致謝等。
        如果你是要報告 skill 報錯、資料錯誤或提改進建議，請返回選擇對應的專用模板（那些需要可復現資訊）。
  - type: textarea
    id: content
    attributes:
      label: 內容
      description: 說清楚你想討論/提議什麼。若是新 skill 提議，請說明它解決什麼研究場景、和現有 skill 的邊界。
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 確認
      options:
        - label: 我已搜尋過現有 issue，確認沒有重複
          required: true
        - label: 這不是 skill 報錯 / 資料錯誤 / 改進建議（那些應走專用模板）
          required: true
