name: 🐞 Skill 報錯 / 無法執行
description: 某個 skill 執行報錯、卡住，或工具/引數缺失導致跑不起來
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感謝反饋 🙏 **請務必給出可復現的具體資訊**——沒有復現資訊的報錯無法定位，會被要求補充或直接關閉。
        提交前請先搜尋是否已有相同 issue。
  - type: dropdown
    id: skill
    attributes:
      label: 涉及的 Skill
      description: 報錯發生在哪個 skill？只選一個，且確保標題與正文描述的是同一個（曾出現標題寫 investment-research、正文寫 investment-team 的情況）。
      options:
        - bottleneck-hunter
        - deep-company-series
        - dyp-ask
        - earnings-review
        - earnings-team
        - financial-data
        - industry-funnel
        - industry-research
        - investment-checklist
        - investment-research
        - investment-team
        - management-deep-dive
        - news-pulse
        - portfolio-review
        - private-company-research
        - quality-screen
        - thesis-drift
        - thesis-tracker
        - wechat-article
        - 不確定
        - 其他 / 涉及多個
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: 你執行的完整命令
      description: 一字不差地貼出你實際輸入的命令。
      placeholder: "/investment-team 美團"
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: 期望結果 vs 實際結果
      description: 你期望發生什麼？實際發生了什麼？請**完整貼出報錯資訊/日誌**，不要只描述。
      placeholder: |
        期望：正常生成四大師並行分析報告
        實際：報錯 "TeamCreate is not a valid tool"，流程中斷
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 復現步驟
      description: 從頭到尾怎麼操作能重現？（安裝方式、執行環境、具體操作順序）
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: 使用的模型
      description: 不同模型表現可能不同，這一項對定位至關重要。
      placeholder: "Opus 4.8 / Sonnet / 其他"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: 客戶端及版本
      placeholder: "Claude Code CLI (版本號) / Codex / IDE 外掛"
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 確認
      options:
        - label: 我已搜尋過現有 issue，確認沒有重複
          required: true
        - label: 我已提供可復現的完整資訊（命令、報錯、模型、客戶端）
          required: true
